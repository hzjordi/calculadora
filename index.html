<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Calculadora Científica Casio Adaptable - Alta Visibilidad</title>
  <style>
    :root {
      --bg-app: #000000;
      --bg-display: #111111;
      --text-main: #FFFF00;
      --border-color: #FFFF00;
      --btn-num-bg: #1a1a1a;
      --btn-num-text: #FFFFFF;
      --btn-op-bg: #004488;
      --btn-op-text: #FFFFFF;
      --btn-sci-bg: #262626;
      --btn-sci-text: #FFFF00;
      --btn-del-bg: #b30000;
      --btn-eq-bg: #007a29;
      --btn-shift-bg: #d97700;
    }

    body.tema-blanco {
      --text-main: #FFFFFF;
      --border-color: #FFFFFF;
      --btn-sci-text: #FFFFFF;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, Helvetica, sans-serif;
      user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: var(--bg-app);
      color: var(--text-main);
      overflow: hidden;
    }

    .app-container {
      display: flex;
      flex-direction: column;
      width: 100vw;
      height: 100vh;
      padding: 8px;
      gap: 8px;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      min-height: 48px;
    }

    .status-indicators {
      display: flex;
      gap: 10px;
      align-items: center;
      font-size: 1.2rem;
      font-weight: 800;
    }

    .badge {
      padding: 6px 12px;
      border: 2px solid var(--border-color);
      border-radius: 8px;
      background: #1a1a1a;
    }

    .badge.shift-active {
      background: var(--btn-shift-bg);
      color: #000000;
    }

    .top-actions {
      display: flex;
      gap: 8px;
    }

    .btn-top {
      padding: 8px 14px;
      font-size: 1.15rem;
      font-weight: 800;
      border-radius: 8px;
      border: 2px solid var(--border-color);
      background: #222222;
      color: #FFFFFF;
      cursor: pointer;
    }

    .btn-salir {
      background-color: #cc0000;
      color: #FFFFFF;
      border-color: #FFFFFF;
      padding: 8px 18px;
      font-size: 1.25rem;
      text-transform: uppercase;
    }

    .btn-salir:active {
      background-color: #ff1a1a;
    }

    /* Pantalla única y grande */
    .display-box {
      background-color: var(--bg-display);
      border: 3px solid var(--border-color);
      border-radius: 10px;
      padding: 10px 16px;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      min-height: 16vh;
    }

    .result {
      font-size: clamp(2.8rem, 7vh, 4.8rem);
      font-weight: 900;
      color: var(--text-main);
      width: 100%;
      text-align: right;
      overflow-x: auto;
      white-space: nowrap;
    }

    .keypad {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    /* Rejilla científica ampliada a 5 columnas para botones más grandes */
    .sci-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 6px;
      flex: 1.3;
    }

    .main-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 6px;
      flex: 2;
    }

    button.key {
      border: 2px solid var(--border-color);
      border-radius: 10px;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2px;
      line-height: 1;
      white-space: nowrap;
      transition: transform 0.05s;
    }

    button.key:active {
      transform: scale(0.96);
      filter: brightness(1.3);
    }

    button.key:focus-visible {
      outline: 4px solid #00ffff;
      outline-offset: 2px;
    }

    .key-sci {
      background-color: var(--btn-sci-bg);
      color: var(--btn-sci-text);
      font-size: clamp(1.4rem, 3.2vh, 2.2rem);
    }

    .key-num {
      background-color: var(--btn-num-bg);
      color: var(--btn-num-text);
      font-size: clamp(2rem, 4.5vh, 3rem);
    }

    .key-op {
      background-color: var(--btn-op-bg);
      color: var(--btn-op-text);
      font-size: clamp(2rem, 4.5vh, 3rem);
    }

    .key-del {
      background-color: var(--btn-del-bg);
      color: #FFFFFF;
      font-size: clamp(1.5rem, 3.3vh, 2.2rem);
    }

    .key-eq {
      background-color: var(--btn-eq-bg);
      color: #FFFFFF;
      font-size: clamp(2.2rem, 4.8vh, 3.2rem);
    }

    .key-shift {
      background-color: var(--btn-shift-bg);
      color: #000000;
      font-size: clamp(1.3rem, 2.8vh, 1.9rem);
    }

    .key-shift.active {
      background-color: #ffffff;
      color: #000000;
      box-shadow: 0 0 12px #FFFF00;
    }
  </style>
</head>
<body>
  <div class="app-container" id="app">
    <div class="top-bar">
      <div class="status-indicators">
        <span class="badge" id="ind-shift">NORMAL</span>
        <button class="btn-top" id="btn-deg" onclick="toggleDeg()">DEG (Grados)</button>
        <button class="btn-top" onclick="toggleTheme()">Contraste</button>
      </div>
      <div class="top-actions">
        <button class="btn-top" id="btn-fullscreen" onclick="activarPantallaCompleta()">Pantalla Completa</button>
        <button class="btn-top btn-salir" onclick="salirApp()">Salir</button>
      </div>
    </div>

    <div class="display-box">
      <div class="result" id="display">0</div>
    </div>

    <div class="keypad">
      <div class="sci-grid">
        <button class="key key-shift" id="btn-shift" onclick="toggleShift()">SHIFT</button>
        <button class="key key-sci" id="key-sqrt" onclick="pressSci('sqrt')">√</button>
        <button class="key key-sci" id="key-sq" onclick="pressSci('sq')">x²</button>
        <button class="key key-sci" id="key-pow" onclick="pressSci('pow')">xʸ</button>
        <button class="key key-sci" id="key-inv" onclick="pressSci('inv')">x⁻¹</button>

        <button class="key key-sci" id="key-sin" onclick="pressSci('sin')">sin</button>
        <button class="key key-sci" id="key-cos" onclick="pressSci('cos')">cos</button>
        <button class="key key-sci" id="key-tan" onclick="pressSci('tan')">tan</button>
        <button class="key key-sci" id="key-log" onclick="pressSci('log')">log</button>
        <button class="key key-sci" id="key-ln" onclick="pressSci('ln')">ln</button>

        <button class="key key-sci" onclick="insertToken('(')">(</button>
        <button class="key key-sci" onclick="insertToken(')')">)</button>
        <button class="key key-sci" onclick="insertFunc('abs(')">|x|</button>
        <button class="key key-sci" onclick="insertPostfix('!')">x!</button>
        <button class="key key-sci" onclick="insertPostfix('%')">%</button>
      </div>

      <div class="main-grid">
        <button class="key key-num" onclick="insertDigit('7')">7</button>
        <button class="key key-num" onclick="insertDigit('8')">8</button>
        <button class="key key-num" onclick="insertDigit('9')">9</button>
        <button class="key key-del" onclick="deleteLast()">DEL</button>
        <button class="key key-del" onclick="clearAll()">AC</button>

        <button class="key key-num" onclick="insertDigit('4')">4</button>
        <button class="key key-num" onclick="insertDigit('5')">5</button>
        <button class="key key-num" onclick="insertDigit('6')">6</button>
        <button class="key key-op" onclick="insertOperator('×')">×</button>
        <button class="key key-op" onclick="insertOperator('÷')">÷</button>

        <button class="key key-num" onclick="insertDigit('1')">1</button>
        <button class="key key-num" onclick="insertDigit('2')">2</button>
        <button class="key key-num" onclick="insertDigit('3')">3</button>
        <button class="key key-op" onclick="insertOperator('+')">+</button>
        <button class="key key-op" onclick="insertOperator('−')">−</button>

        <button class="key key-num" onclick="insertDigit('0')">0</button>
        <button class="key key-num" onclick="insertDigit('.')">.</button>
        <button class="key key-sci" id="key-const" onclick="pressConst()">π</button>
        <button class="key key-sci" onclick="insertAns()">Ans</button>
        <button class="key key-eq" onclick="calculate()">=</button>
      </div>
    </div>
  </div>

  <script>
    let currentExpr = '';
    let lastAns = 0;
    let isDeg = true;
    let isShift = false;
    let justEvaluated = false;

    const displayEl = document.getElementById('display');
    const shiftBadge = document.getElementById('ind-shift');
    const shiftBtn = document.getElementById('btn-shift');
    const degBtn = document.getElementById('btn-deg');

    function activarPantallaCompleta() {
      const elem = document.documentElement;
      if (!document.fullscreenElement) {
        if (elem.requestFullscreen) {
          elem.requestFullscreen().catch(() => {});
        } else if (elem.webkitRequestFullscreen) {
          elem.webkitRequestFullscreen();
        }
      }
    }

    function salirApp() {
      if (document.fullscreenElement) {
        document.exitFullscreen().catch(() => {});
      }
      window.close();
      setTimeout(() => {
        alert('Has salido de la pantalla completa. Ya puedes cerrar esta pestaña o volver atrás.');
      }, 200);
    }

    function toggleTheme() {
      document.body.classList.toggle('tema-blanco');
    }

    function toggleDeg() {
      isDeg = !isDeg;
      degBtn.textContent = isDeg ? 'DEG (Grados)' : 'RAD (Radianes)';
    }

    function setShift(state) {
      isShift = state;
      shiftBadge.textContent = isShift ? 'SHIFT' : 'NORMAL';
      shiftBadge.classList.toggle('shift-active', isShift);
      shiftBtn.classList.toggle('active', isShift);

      document.getElementById('key-sqrt').textContent = isShift ? '∛' : '√';
      document.getElementById('key-sq').textContent = isShift ? 'x³' : 'x²';
      document.getElementById('key-pow').textContent = isShift ? 'ⁿ√' : 'xʸ';
      document.getElementById('key-sin').textContent = isShift ? 'sin⁻¹' : 'sin';
      document.getElementById('key-cos').textContent = isShift ? 'cos⁻¹' : 'cos';
      document.getElementById('key-tan').textContent = isShift ? 'tan⁻¹' : 'tan';
      document.getElementById('key-log').textContent = isShift ? '10ˣ' : 'log';
      document.getElementById('key-ln').textContent = isShift ? 'eˣ' : 'ln';
      document.getElementById('key-const').textContent = isShift ? 'e' : 'π';
    }

    function toggleShift() {
      setShift(!isShift);
    }

    function updateScreen(val) {
      displayEl.textContent = val || '0';
      displayEl.scrollLeft = displayEl.scrollWidth;
    }

    function insertDigit(d) {
      if (justEvaluated) {
        currentExpr = '';
        justEvaluated = false;
      }
      currentExpr += d;
      updateScreen(currentExpr);
    }

    function insertOperator(op) {
      if (justEvaluated) {
        currentExpr = 'Ans';
        justEvaluated = false;
      }
      if (currentExpr === '') {
        if (op === '−') {
          currentExpr = '−';
          updateScreen(currentExpr);
          return;
        }
        currentExpr = 'Ans';
      }
      currentExpr += op;
      updateScreen(currentExpr);
    }

    function insertToken(tok) {
      if (justEvaluated) {
        currentExpr = '';
        justEvaluated = false;
      }
      currentExpr += tok;
      updateScreen(currentExpr);
    }

    function insertFunc(fn) {
      if (justEvaluated) {
        currentExpr = '';
        justEvaluated = false;
      }
      currentExpr += fn;
      updateScreen(currentExpr);
    }

    function insertPostfix(sym) {
      if (justEvaluated) {
        currentExpr = 'Ans';
        justEvaluated = false;
      }
      if (currentExpr === '') currentExpr = 'Ans';
      currentExpr += sym;
      updateScreen(currentExpr);
    }

    function pressSci(type) {
      if (type === 'sqrt') {
        insertFunc(isShift ? '∛(' : '√(');
      } else if (type === 'sq') {
        insertPostfix(isShift ? '³' : '²');
      } else if (type === 'pow') {
        if (justEvaluated) { currentExpr = 'Ans'; justEvaluated = false; }
        if (currentExpr === '') currentExpr = 'Ans';
        currentExpr += isShift ? '^(1/' : '^';
        updateScreen(currentExpr);
      } else if (type === 'inv') {
        insertPostfix('⁻¹');
      } else if (type === 'sin') {
        insertFunc(isShift ? 'sin⁻¹(' : 'sin(');
      } else if (type === 'cos') {
        insertFunc(isShift ? 'cos⁻¹(' : 'cos(');
      } else if (type === 'tan') {
        insertFunc(isShift ? 'tan⁻¹(' : 'tan(');
      } else if (type === 'log') {
        insertFunc(isShift ? '10^(' : 'log(');
      } else if (type === 'ln') {
        insertFunc(isShift ? 'e^(' : 'ln(');
      }
      if (isShift) setShift(false);
    }

    function pressConst() {
      insertToken(isShift ? 'e' : 'π');
      if (isShift) setShift(false);
    }

    function insertAns() {
      if (justEvaluated) {
        currentExpr = '';
        justEvaluated = false;
      }
      currentExpr += 'Ans';
      updateScreen(currentExpr);
    }

    function deleteLast() {
      if (justEvaluated) {
        clearAll();
        return;
      }
      const multiTokens = ['sin⁻¹(', 'cos⁻¹(', 'tan⁻¹(', 'sin(', 'cos(', 'tan(', 'log(', 'ln(', 'abs(', 'Ans', '√(', '∛(', '10^(', 'e^(', '⁻¹'];
      for (let tok of multiTokens) {
        if (currentExpr.endsWith(tok)) {
          currentExpr = currentExpr.slice(0, -tok.length);
          updateScreen(currentExpr);
          return;
        }
      }
      currentExpr = currentExpr.slice(0, -1);
      updateScreen(currentExpr);
    }

    function clearAll() {
      currentExpr = '';
      justEvaluated = false;
      setShift(false);
      updateScreen('0');
    }

    function factorial(n) {
      if (n < 0 || !Number.isInteger(n)) return NaN;
      if (n === 0 || n === 1) return 1;
      let res = 1;
      for (let i = 2; i <= n; i++) res *= i;
      return res;
    }

    function calculate() {
      if (!currentExpr) return;
      try {
        let expr = currentExpr;

        expr = expr.replace(/sin⁻¹\(/g, 'asin(')
                   .replace(/cos⁻¹\(/g, 'acos(')
                   .replace(/tan⁻¹\(/g, 'atan(');

        expr = expr.replace(/√\(/g, 'sqrt(')
                   .replace(/∛\(/g, 'cbrt(')
                   .replace(/×/g, '*')
                   .replace(/÷/g, '/')
                   .replace(/−/g, '-');

        expr = expr.replace(/²/g, '**2')
                   .replace(/³/g, '**3')
                   .replace(/⁻¹/g, '**(-1)')
                   .replace(/%/g, '/100');

        expr = expr.replace(/(\d+(?:\.\d+)?|\([^()]+\))!/g, 'fact($1)');

        expr = expr.replace(/(\d|\)|π|e|Ans)(?=\(|π|e|Ans|sin|cos|tan|asin|acos|atan|log|ln|sqrt|cbrt|abs)/g, '$1*');
        expr = expr.replace(/(\)|π|e|Ans)(?=\d)/g, '$1*');

        expr = expr.replace(/π/g, 'Math.PI')
                   .replace(/e/g, 'Math.E')
                   .replace(/Ans/g, `(${lastAns})`)
                   .replace(/\^/g, '**');

        const openParens = (expr.match(/\(/g) || []).length;
        const closeParens = (expr.match(/\)/g) || []).length;
        if (openParens > closeParens) {
          expr += ')'.repeat(openParens - closeParens);
        }

        const toRad = (x) => isDeg ? (x * Math.PI / 180) : x;
        const fromRad = (x) => isDeg ? (x * 180 / Math.PI) : x;

        const sin = (x) => Math.sin(toRad(x));
        const cos = (x) => Math.cos(toRad(x));
        const tan = (x) => Math.tan(toRad(x));
        const asin = (x) => fromRad(Math.asin(x));
        const acos = (x) => fromRad(Math.acos(x));
        const atan = (x) => fromRad(Math.atan(x));
        const log = (x) => Math.log10(x);
        const ln = (x) => Math.log(x);
        const sqrt = (x) => Math.sqrt(x);
        const cbrt = (x) => Math.cbrt(x);
        const abs = (x) => Math.abs(x);
        const fact = (x) => factorial(x);

        let evalResult = Function(
          'sin','cos','tan','asin','acos','atan','log','ln','sqrt','cbrt','abs','fact',
          `return (${expr})`
        )(sin, cos, tan, asin, acos, atan, log, ln, sqrt, cbrt, abs, fact);

        if (!isFinite(evalResult) || isNaN(evalResult)) {
          displayEl.textContent = 'Error';
          currentExpr = '';
          return;
        }

        evalResult = Number(evalResult.toPrecision(12));
        displayEl.textContent = evalResult;
        lastAns = evalResult;
        currentExpr = String(evalResult);
        justEvaluated = true;
      } catch (e) {
        displayEl.textContent = 'Error';
        currentExpr = '';
      }
    }
  </script>
</body>
</html>
